<app-station-stepper
  pageTitle="COMPLAINTS & OBSERVATIONS"
  (back)="backLocation()">
</app-station-stepper>

<ion-content>
  <ion-card class="complaints-card">
    <ion-card-content>
      <ion-grid class="ion-no-padding">
        
        <!-- Question Header (Placed OUTSIDE ion-row) -->
        <p class="participant-info">1.Ocular Complaints?</p>

        <!-- Complaint list grid -->
        <ion-row class="checkbox-grid">
          <ion-col size="12" size-sm="6" *ngFor="let complaint of complaints">
            <ion-item lines="none" class="checkbox-item">
              <ion-checkbox
                slot="start"
                [(ngModel)]="complaint.selected"
                (ionChange)="onComplaintChange(complaint)">
              </ion-checkbox>
              <ion-label>{{ complaint.label }}</ion-label>
            </ion-item>
          </ion-col>
        </ion-row>

        <!-- Physical Disability Field -->
        <div class="form-group ion-margin-top">
          <p class="participant-info">2. Any other health complaints?</p>
          <div class="border text-input-wrapper">
            <ion-input [(ngModel)]="otherText" placeholder="physical disability?"></ion-input>
          </div>
        </div>

        <!-- Eye affected (VISIBLE ONLY if a real complaint is selected) -->
        <div *ngIf="hasComplaintSelected" class="ion-margin-top">
          <p class="participant-info">3. Which eye is affected?</p>

          <ion-radio-group [(ngModel)]="eyeAffected" class="radio-group-container">
            <ion-item lines="none" class="radio-item">
              <ion-label>Right Eye (RE)</ion-label>
              <ion-radio slot="start" value="RE"></ion-radio>
            </ion-item>

            <ion-item lines="none" class="radio-item">
              <ion-label>Left Eye (LE)</ion-label>
              <ion-radio slot="start" value="LE"></ion-radio>
            </ion-item>

            <ion-item lines="none" class="radio-item">
              <ion-label>Both</ion-label>
              <ion-radio slot="start" value="BOTH"></ion-radio>
            </ion-item>

            <ion-item lines="none" class="radio-item">
              <ion-label>Not sure</ion-label>
              <ion-radio slot="start" value="UNKNOWN"></ion-radio>
            </ion-item>
          </ion-radio-group>
        </div>

        <!-- Footer Navigation -->
        <app-profile-footer
          (saveProgressClick)="submitForm()"
          (editClick)="onEdit()"
          (deleteClick)="onDelete()">
        </app-profile-footer>

      </ion-grid>
    </ion-card-content>
  </ion-card>
</ion-content>
