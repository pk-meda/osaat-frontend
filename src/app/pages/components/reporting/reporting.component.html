<ion-header mode="md">
  <ion-toolbar>
    <ion-title class="custom-title">
      <ion-icon class="back_icon" name="chevron-back-outline" (click)="backLocation()"></ion-icon>
      <span class="back_btn">REPORTS </span>
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-card>
    <ion-card-content>
      <div class="report-header-section">
        <h2>Export Spec Order Sheets</h2>
        <p>Extract clinical spectacles prescriptions, dispensing configurations, and demographics into a standard spreadsheet layout.</p>
      </div>

      <!-- Searchable School Select -->
<!-- Clickable Item Triggering Modal -->
<ion-item lines="full" class="ion-margin-vertical" id="open-school-modal" button>
  <ion-label position="floating">Filter by School (Optional)</ion-label>
  <ion-input [value]="selectedSchool || 'All Schools'" readonly></ion-input>
  <ion-icon name="search-outline" slot="end"></ion-icon>
</ion-item>

<!-- Searchable Modal overlay -->
<ion-modal trigger="open-school-modal" #schoolModal>
  <ng-template>
    <ion-header>
      <ion-toolbar>
        <ion-title>Select School</ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="schoolModal.dismiss()">Close</ion-button>
        </ion-buttons>
      </ion-toolbar>
      <ion-toolbar>
        <!-- Search bar filters the list instantly -->
        <ion-searchbar 
          placeholder="Search school name..." 
          (ionInput)="filterSchools($event)">
        </ion-searchbar>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <!-- Option to reset filter -->
        <ion-item button (click)="selectSchool(''); schoolModal.dismiss()">
          <ion-label><strong>All Schools</strong></ion-label>
        </ion-item>

        <!-- Dynamic Filtered School List -->
        <ion-item 
          *ngFor="let school of filteredSchools" 
          button 
          (click)="selectSchool(school); schoolModal.dismiss()">
          <ion-label>{{ school }}</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>

      <div class="button_group">
        <div class="save_btn">
          <ion-button class="btn" expand="full" color="primary" (click)="downloadReport()">
            <ion-icon name="download-outline" slot="start"></ion-icon>
            Download CSV Report
          </ion-button>
        </div>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
