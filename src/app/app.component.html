<ion-menu menuId="main-menu" contentId="main-content" side="end" type="overlay">
  <ion-header>
    <ion-toolbar>
      <ion-title>Main Menu</ion-title>
    </ion-toolbar>
  </ion-header>
  
  <ion-content mode="md">
    <!-- Profile Header Section -->
    <div class="menu-profile-section ion-padding text-center" (click)="openProfileModal()">
      <div class="avatar-container">
        <!-- Blank/Placeholder circular profile image -->
        <img *ngIf="userProfile?.avatar; else defaultAvatar" [src]="userProfile.avatar" alt="Profile" />
        <ng-template #defaultAvatar>
          <div class="default-avatar-inner">
            {{ getUserInitial() }}
          </div>
        </ng-template>
      </div>
      <div class="profile-info">
        <h2>{{ userProfile?.first_name || userProfile?.email || 'User' }}</h2>
        <p>{{ userProfile?.username || 'account' }}</p>
      </div>
    </div>

    <ion-list lines="none">
      <ion-item button routerLink="/layout/school-register" menuClose>
        <ion-icon name="home-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-item>
      <ion-item button routerLink="/layout/spectacle-wearing" menuClose>
        <ion-icon name="time-outline" slot="start" color="primary"></ion-icon>
        <ion-label>History</ion-label>
      </ion-item>
      
      <!-- New Reports Sidebar Item -->
      <ion-item button routerLink="/layout/reporting" menuClose>
        <ion-icon name="document-text-outline" slot="start" color="primary"></ion-icon>
        <ion-label>Reports</ion-label>
      </ion-item>
      
      <ion-item button (click)="logout()" lines="none" detail="false">
        <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
        <ion-label color="danger">Logout</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>

<ion-router-outlet id="main-content"></ion-router-outlet>
